<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Acceso - VERA</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 320px; }
        h2 { text-align: center; color: #333; }
        label { display: block; margin: 10px 0 5px; color: #666; }
        input[type="password"], input[type="text"] { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .alerta { text-align: center; margin-top: 15px; font-weight: bold; color: #28a745; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Sistema VERA</h2>
        <form action="/enviar_a_esp" method="POST">
            <label>Contraseña:</label>
            <input type="password" name="password" placeholder="Introduce la clave" required>
            
            <label>Mensaje personalizado:</label>
            <input type="text" name="mensaje" placeholder="Ej. Hola desde la laptop" required>
            
            <button type="submit">Enviar al Hardware</button>
        </form>
        {% if resultado %}
            <div class="alerta">{{ resultado }}</div>
        {% endif %}
    </div>
</body>
</html>
